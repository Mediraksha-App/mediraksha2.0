name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci-health-check:
    name: CI Health & Integrity Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix ./backend
          npm install --prefix ./frontend

      - name: Verify Backend Syntax & Integrity
        run: node --check ./backend/src/server.js

      - name: Run Backend Security & Health Tests
        run: npm test --prefix ./backend

      - name: Verify Frontend Build & TypeScript
        run: npm run build --prefix ./frontend

      - name: Run Security Audit
        run: npm audit --prefix ./backend --audit-level=high || true

  app:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ ci-health-check ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          password: ${{ secrets.TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/Mediraksha-App/mediraksha-app:latest
            ghcr.io/Mediraksha-App/mediraksha-app:${{ github.sha }}

  deploy:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: [ app ]
    steps:
      - name: Trigger Render Backend Redeploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_WEBHOOK_URL_APP }}"
